
name: MediCare CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: Test our Spring Boot backend
  backend-tests:
    name: Spring Boot Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medicare_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medicare_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/medicare_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ci_test_password
      DEMO_ADMIN_PASSWORD: ci_admin_password
      DEMO_VIEWER_PASSWORD: ci_viewer_password
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: medicare-backend/pom.xml

      - name: Generate temporary JWT signing key
        run: echo "JWT_SECRET_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run Maven tests
        working-directory: medicare-backend
        run: mvn -B clean verify

  # JOB 2: Build our React frontend
  frontend-build:
    name: React Build
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medicare-frontend/package-lock.json

      - name: Install React dependencies
        working-directory: medicare-frontend
        run: npm ci

      - name: Build React
        working-directory: medicare-frontend
        run: npm run build

  # JOB 3: Build our Docker images
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Build Spring Boot Docker image
        run: docker build -t medicare-backend:ci ./medicare-backend

      - name: Build React Docker image
        run: docker build -t medicare-frontend:ci ./medicare-frontend
