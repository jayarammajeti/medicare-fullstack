spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicare_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

app.demo-admin-password=${DEMO_ADMIN_PASSWORD}
app.demo-viewer-password=${DEMO_VIEWER_PASSWORD}
app.jwt-secret-base64=${JWT_SECRET_BASE64}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379



# Kafka connection
spring.kafka.bootstrap-servers=localhost:9092

# Producer: send text messages
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer: read text messages
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=medicare-demo
spring.kafka.consumer.auto-offset-reset=earliest
